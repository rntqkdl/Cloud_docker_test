# ==============================================================================
# [SKALA K8s Lab] ch08-ingress/ingress.yaml : AWS ALB L7 스마트 게이트웨이 Ingress
# ==============================================================================
# • 개념: 클러스터 외부의 인터넷 트래픽(HTTP/HTTPS)을 단 1개의 로드밸런서(ALB)로 수신하여
#         URL 경로(/api)나 도메인 기반으로 백엔드 Service로 분기 라우팅합니다.
# • AWS ALB Ingress Controller 핵심 어노테이션:
#   - scheme: internet-facing (외부 인터넷에서 직접 접근 가능한 공인 IP ALB 생성)
#   - target-type: ip (워커 노드를 거치지 않고 Pod IP로 직접 패킷을 초고속 전달)
#   - group.name: student-01 (여러 Ingress가 1개의 ALB를 공유하여 AWS 비용 절감)
#   - healthcheck: 8081 포트의 /actuator/health/readiness로 ALB 타깃 그룹 헬스체크
# • 실행: kubectl apply -f ch08-ingress/ingress.yaml
# • 주소 확인: kubectl get ingress shop-api -w (ALB DNS ADDRESS 생성까지 약 2~3분 소요)
# • 실습 완료 후 삭제: kubectl delete -f ch08-ingress/ingress.yaml (AWS ALB 요금 발생 방지)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-api
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing             # 인터넷 공개용 로드밸런서 설정
    alb.ingress.kubernetes.io/target-type: ip                     # Pod 사설 IP로 직접 트래픽 전달 (CRI CNI 연동)
    alb.ingress.kubernetes.io/group.name: student-01              # ALB 공유 그룹 (비용 절약 핵심)
    # ALB가 Pod의 준비 완료 여부를 관리 포트(8081)의 readiness 엔드포인트로 직접 헬스체크
    alb.ingress.kubernetes.io/healthcheck-port: "8081"
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "5"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # HTTPS(SSL) 설정 시 아래 두 줄의 주석을 풀고 AWS ACM 인증서 ARN 기입
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:123456789012:certificate/xxx
    # alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  ingressClassName: alb                                           # AWS Load Balancer Controller 지정
  rules:
    - http:
        paths:
          - path: /api                                            # /api 로 시작하는 모든 요청 라우팅
            pathType: Prefix
            backend:
              service:
                name: shop-api                                    # 대상 Service 이름
                port:
                  number: 80                                      # Service의 80 포트로 연결
