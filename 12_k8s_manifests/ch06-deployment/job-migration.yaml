# ==============================================================================
# [SKALA K8s Lab] ch06-deployment/job-migration.yaml : 1회성 DB 마이그레이션 Job
# ==============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: skala-gj4
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      imagePullSecrets:
        - name: harbor-cred
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: harbor.skala-gj.com/skala-gj4/shop-api:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo '=== DB 마이그레이션 시작 ==='; sleep 5; echo '=== DB 스키마 패치 성공 완료 ==='"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
