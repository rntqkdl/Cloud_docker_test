# ==============================================================================
# [SKALA K8s Lab] ch05-pod/pod-with-probes.yaml : 3대 헬스체크 프로브 완비 Pod
# ==============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: shop-api-probes
  namespace: skala-gj4
  labels:
    app: shop-api-probes
spec:
  imagePullSecrets:
    - name: harbor-cred
  containers:
    - name: app
      image: harbor.skala-gj.com/skala-gj4/shop-api:1.0.0
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
        - name: mgmt
          containerPort: 8081
      startupProbe:
        httpGet:
          path: /actuator/health/liveness
          port: mgmt
        periodSeconds: 5
        failureThreshold: 30
      livenessProbe:
        httpGet:
          path: /actuator/health/liveness
          port: mgmt
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /actuator/health/readiness
          port: mgmt
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
