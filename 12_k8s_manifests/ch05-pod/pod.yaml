# ==============================================================================
# [SKALA K8s Lab] ch05-pod/pod.yaml : 단일 파드(Pod) 기본 매니페스트
# ==============================================================================
# • 개념: 쿠버네티스의 '가장 작은 배포 단위'인 Pod를 직접 생성합니다.
# • 주의: 실무에서는 컨트롤러 없는 네이키드 Pod(Naked Pod)를 직접 만들지 않습니다.
#         Pod가 죽었을 때 다시 살려줄 상위 관리자(Deployment)가 없기 때문입니다.
# • 실행: kubectl apply -f ch05-pod/pod.yaml
# • 검증: kubectl get pod shop-api-manual -o wide
# • 삭제: kubectl delete pod shop-api-manual (스스로 되살아나지 않고 영구 소멸됨 확인)
# ==============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: shop-api-manual              # 클러스터 내에서 유일해야 하는 Pod 이름
  labels:
    app: shop-api-manual             # Service나 모니터링이 이 Pod를 찾을 때 사용하는 이름표
spec:
  containers:
    - name: app
      image: shop-api:1.0.0          # 로컬 빌드 이미지 또는 ECR/Harbor 원격 레지스트리 이미지
      imagePullPolicy: IfNotPresent  # 로컬에 이미지가 있으면 다운로드를 생략하고 즉시 기동
      ports:
        - name: http
          containerPort: 8080        # 비즈니스 REST API 요청을 수신하는 포트
        - name: mgmt
          containerPort: 8081        # Liveness/Readiness 헬스체크 및 Actuator 전용 포트
      env:
        # [Downward API - 쿠버네티스가 Pod의 메타데이터를 환경변수로 직접 주입해 줌]
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name       # 이 Pod의 실제 생성된 이름 주입
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName       # 이 Pod가 배치된 워커 노드(서버 머신) 이름 주입
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP        # CNI 가상 네트워크가 이 Pod에 할당한 사설 IP 주입
      resources:
        # [리소스 보장과 상한선 - 서버 과부하 및 OOM 방지]
        requests:
          cpu: 200m                          # 최소 0.2 코어(200 밀리코어)의 CPU 연산량 보장
          memory: 512Mi                      # 최소 512MB 메모리 확보 시에만 노드에 배치
        limits:
          cpu: "1"                           # 최대 1개 CPU 코어까지만 버스팅 허용
          memory: 1Gi                        # 1GB 초과 사용 시 커널 OOM-Killer가 즉시 차단
  restartPolicy: Always                      # 컨테이너 프로세스가 비정상 종료 시 무조건 재시작
