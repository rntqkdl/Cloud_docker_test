# ==============================================================================
# [SKALA K8s Lab] ch05-pod/pod.yaml : 단일 파드(Pod) 기본 매니페스트
# ==============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: shop-api-manual
  namespace: skala-gj4
  labels:
    app: shop-api-manual
spec:
  imagePullSecrets:
    - name: harbor-cred
  containers:
    - name: app
      image: harbor.skala-gj.com/skala-gj4/shop-api:1.0.0
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
        - name: mgmt
          containerPort: 8081
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
  restartPolicy: Always
