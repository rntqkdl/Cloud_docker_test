# ==============================================================================
# [SKALA K8s Lab] ch07-service/service.yaml : L4 내부 로드밸런서 Service
# ==============================================================================
# • 개념: 수시로 죽고 재생성되며 IP가 바뀌는 Pod들에게 변하지 않는 고정 가상 IP(VIP)와
#         내부 DNS 도메인 이름(`shop-api.default.svc.cluster.local`)을 제공합니다.
# • 로드밸런싱 원리:
#   - selector.app = shop-api 라벨을 가진 "Ready 상태의 Pod"만 엔드포인트에 실시간 등록
#   - 80번 포트로 들어오는 요청을 Pod의 8080(http) 포트로 분산 라우팅
#   - 8081(관리 포트)은 서비스에 노출하지 않아 내부 보안 격리 달성
# • 실행: kubectl apply -f ch07-service/service.yaml
# • 엔드포인트 확인: kubectl get endpoints shop-api (정상 Pod IP 목록 출력 확인)
# • 부하분산 테스트: kubectl run nettest --rm -it --image=curlimages/curl -- sh
#   -> curl -s http://shop-api/api/info (호출할 때마다 응답하는 pod 이름이 순환 분산됨)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: shop-api
  labels:
    app: shop-api
spec:
  type: ClusterIP                            # 클러스터 내부 전용 고정 VIP 생성
  selector:
    app: shop-api                            # 이 라벨을 가진 정상(Ready) Pod들로 트래픽 전달
  ports:
    - name: http
      port: 80                               # 클러스터 내부에서 접속할 서비스 포트 (예: http://shop-api:80)
      targetPort: http                       # 컨테이너의 포트 이름 'http'(8080)를 찾아 매핑 (번호 변경에 안전)
