services:
  web:
    image: nginx:alpine
    container_name: dashboard-web
    ports:
      - "8088:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - was
    restart: unless-stopped

  was:
    build: ./was
    container_name: dashboard-was
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password123
      DB_NAME: dashboard_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11
    container_name: dashboard-db
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: dashboard_db
    volumes:
      - dashboard-db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  dashboard-db-data:
