services:
  web:
    image: nginx:alpine
    container_name: dashboard-web
    ports:
      - "8088:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - was
    restart: unless-stopped

  was:
    build: ./was_spring
    container_name: dashboard-was-spring
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password123
      DB_NAME: dashboard_db
      OLLAMA_HOST: http://host.docker.internal:11434
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: dashboard-db-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: dashboard_db
    volumes:
      - postgres-db-data:/var/lib/postgresql/data
      - ./db_postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dashboard_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-db-data:
